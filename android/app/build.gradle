plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'io.github.mitez671.iranmarket'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.mitez671.iranmarket'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets.main.assets.srcDir(layout.buildDirectory.dir('generated/dashboard'))
}

def dashboardAssets = tasks.register('syncDashboardAssets', Sync) {
    from('../../web') {
        include 'index.html', 'css/**', 'js/**'
    }
    into layout.buildDirectory.dir('generated/dashboard')
}

tasks.named('preBuild').configure {
    dependsOn dashboardAssets
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:3.14.9'
}
